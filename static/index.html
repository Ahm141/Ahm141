<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حبوشي، سكرتيرك الشخصي</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1a24;--panel:#15273a;--line:#264560;--ink:#eaf2f6;--mute:#8fa9ba;--face:#e8c58b;--face-d:#c99a5b;--accent:#2fb5c4}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,sans-serif;display:grid;grid-template-columns:1fr 340px;gap:0}
main{display:flex;flex-direction:column;align-items:center;padding:24px 20px;min-height:100vh}
#face{width:min(300px,60vw);margin-top:2vh;transition:transform .4s}
#status{margin:6px 0 14px;color:var(--mute);font-size:.95rem;height:1.4em}
body[data-s=listening] #status{color:var(--accent)}
#log{flex:1;width:min(560px,100%);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px}
.m{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.7}
.m.u{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.m.a{align-self:flex-end;background:transparent;border:1px solid var(--accent)}
#ctl{display:flex;gap:10px;margin-top:14px}#ctl button{height:48px;min-width:140px}#mute{background:var(--panel);color:var(--ink);border:1px solid var(--line)}[hidden]{display:none!important}
input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:12px;font:inherit}
button{background:var(--accent);color:#06222a;border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
#go.live{background:#ff7a59}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
aside{background:var(--panel);border-right:1px solid var(--line);padding:24px 18px;overflow-y:auto}
aside h2{font-size:1.05rem;font-weight:600;margin-bottom:14px}
.ap{border-bottom:1px solid var(--line);padding:10px 0}
.ap b{display:block;font-weight:400}.ap small{color:var(--mute)}
.empty{color:var(--mute)}
@keyframes pulse{50%{box-shadow:0 0 0 8px #ff7a5933}}
@media(max-width:800px){body{grid-template-columns:1fr}aside{border:0;border-top:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body data-s="idle">
<main>
  <svg id="face" viewBox="0 0 300 300" aria-label="وجه حبوشي">
    <ellipse cx="150" cy="160" rx="112" ry="124" fill="var(--face)"/>
    <ellipse cx="150" cy="160" rx="112" ry="124" fill="none" stroke="var(--face-d)" stroke-width="4"/>
    <path d="M60 110 Q150 20 240 110 Q150 60 60 110Z" fill="#1d3a52"/>
    <g id="brows" stroke="#6b4a24" stroke-width="6" stroke-linecap="round">
      <line id="bL" x1="95" y1="118" x2="130" y2="114"/><line id="bR" x1="170" y1="114" x2="205" y2="118"/></g>
    <g id="eyes" fill="#1b2430">
      <g id="eL"><ellipse cx="112" cy="150" rx="20" ry="14" fill="#fff"/><circle class="p" cx="112" cy="150" r="9"/></g>
      <g id="eR"><ellipse cx="188" cy="150" rx="20" ry="14" fill="#fff"/><circle class="p" cx="188" cy="150" r="9"/></g></g>
    <path d="M150 165 Q143 190 152 196" stroke="var(--face-d)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="150" cy="232" rx="34" ry="4" fill="#7a2f2f" id="mouth"/>
    <circle cx="82" cy="205" r="14" fill="#e59a6c" opacity=".35"/><circle cx="218" cy="205" r="14" fill="#e59a6c" opacity=".35"/>
  </svg>
  <div id="status" aria-live="polite">اضغط ابدأ الحديث</div>
  <div id="log"></div>
  <div id="ctl"><button id="go">ابدأ الحديث</button><button id="mute" hidden>اكتم المايك</button></div>
</main>
<aside><h2>مواعيدك القادمة</h2><div id="aps"></div></aside>

<script type="module">
import {Room,RoomEvent,Track} from 'https://cdn.jsdelivr.net/npm/livekit-client@2.9.0/+esm';
const $=s=>document.querySelector(s), log=$('#log'), status=$('#status'), mouth=$('#mouth'), body=document.body;
let state='idle', open=0, level=0, analyser=null, buf=null, blinkT=0, look={x:0,y:0}, room=null, muted=false, apTimer=null;
const setState=(s,t)=>{state=s;body.dataset.s=s;if(t)status.textContent=t};

/* ---- الوجه: الفم يتبع مستوى صوت الوكيل الحقيقي ---- */
addEventListener('pointermove',e=>{const r=$('#face').getBoundingClientRect();
  look.x=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/400));
  look.y=Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height/2))/400))});
(function loop(t){
  let target=0;
  if(analyser){analyser.getByteTimeDomainData(buf);let s=0;for(const v of buf){const d=(v-128)/128;s+=d*d}
    level=Math.sqrt(s/buf.length);target=Math.min(1,level*5)}
  else if(state==='speaking')target=.3+Math.random()*.5;
  open+=(target-open)*.45;
  mouth.setAttribute('rx',34-open*8);mouth.setAttribute('ry',4+open*20);
  const blink=(t-blinkT)%4200<130?.1:1;
  ['eL','eR'].forEach(id=>{const g=$('#'+id);
    g.setAttribute('transform',`translate(0 150) scale(1 ${blink}) translate(0 -150)`);
    g.querySelector('.p').setAttribute('transform',`translate(${look.x*6} ${look.y*4})`)});
  const lift=state==='thinking'?-8:state==='listening'?-4:0;
  $('#bL').setAttribute('transform',`translate(0 ${lift})`);$('#bR').setAttribute('transform',`translate(0 ${lift})`);
  $('#face').style.transform=state==='thinking'?'rotate(-3deg)':'none';
  requestAnimationFrame(loop)})(0);

/* ---- النص المكتوب للمحادثة ---- */
const segs={};
function onTranscript(reader,info){
  const id=reader.info.attributes?.['lk.segment_id']||reader.info.id, mine=info.identity==='ahmed';
  (async()=>{
    if(!segs[id]){const d=document.createElement('div');d.className='m '+(mine?'u':'a');log.append(d);segs[id]=d}
    let txt='';for await(const c of reader){txt+=c;segs[id].textContent=mine?txt:segs[id].textContent+c;log.scrollTop=1e9}
  })()}

/* ---- الاتصال ---- */
async function start(){
  $('#go').disabled=true;setState('idle','دا اتصل...');
  try{
    const {token,url}=await (await fetch('/api/token')).json();
    room=new Room({audioCaptureDefaults:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    room.on(RoomEvent.TrackSubscribed,track=>{
      if(track.kind!==Track.Kind.Audio)return;
      document.body.append(track.attach());
      const ac=new AudioContext(), src=ac.createMediaStreamSource(new MediaStream([track.mediaStreamTrack]));
      analyser=ac.createAnalyser();analyser.fftSize=512;buf=new Uint8Array(analyser.fftSize);src.connect(analyser)});
    room.on(RoomEvent.ParticipantAttributesChanged,(ch,p)=>{
      const s=p.attributes?.['lk.agent.state'];if(!s)return;
      const m={listening:['listening','دا اسمعك...'],thinking:['thinking','حبوشي يفكر...'],speaking:['speaking','حبوشي يحجي...']}[s];
      if(m)setState(...m)});
    room.on(RoomEvent.Disconnected,stop);
    room.registerTextStreamHandler('lk.transcription',onTranscript);
    await room.connect(url,token);
    await room.localParticipant.setMicrophoneEnabled(true);
    $('#go').textContent='انهاء';$('#go').classList.add('live');$('#mute').hidden=false;
    setState('idle','بانتظار حبوشي...');
    apTimer=setInterval(loadAps,3000);
  }catch(e){console.error(e);setState('idle','ما كدرت اتصل، تأكد من السيرفر والمفاتيح')}
  $('#go').disabled=false}
function stop(){
  clearInterval(apTimer);analyser=null;room=null;muted=false;
  $('#go').textContent='ابدأ الحديث';$('#go').classList.remove('live');$('#mute').hidden=true;$('#mute').textContent='اكتم المايك';
  setState('idle','اضغط ابدأ الحديث')}
$('#go').onclick=()=>room?room.disconnect():start();
$('#mute').onclick=async()=>{muted=!muted;await room.localParticipant.setMicrophoneEnabled(!muted);$('#mute').textContent=muted?'شغّل المايك':'اكتم المايك'};

async function loadAps(){
  try{const a=await (await fetch('/api/appointments')).json();
    $('#aps').innerHTML=a.length?a.map(x=>`<div class="ap"><b>${x.title}</b><small>${x.date} · ${x.time}</small></div>`).join(''):'<p class="empty">ماكو مواعيد بعد.</p>'}catch{}}
loadAps();
</script>
</body>
</html>
